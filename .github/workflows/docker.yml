# Publishes Basalt Host's Docker image when a release is published.
#
#   ghcr.io/refora-technologies/basalt-host:1.5.0, :1.5 and :latest
#
# Built for amd64 and arm64 (the program is cross-compiled; QEMU only runs the
# final image's package install), then signed with cosign and given a build
# attestation, so anyone can check it came from this repository. Uses only the
# workflow's own token: no secrets to manage.
#
# To publish a release's image again (say the first run failed), run this
# workflow by hand with that release's tag: it builds from the tag, whatever
# the branch it is started from.
name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and publish, such as v1.5.0
        required: true
      latest:
        description: Also tag it latest (only for the newest release)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/basalt-host
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: '$TAG'" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The description goes on the image index too: for an image built for
      # several machines, that is where the package page reads it from.
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.latest) }}
          labels: |
            org.opencontainers.image.title=Basalt Host
            org.opencontainers.image.description=Shares a drive with your phones and computers on your network, set up and managed from the Basalt app.
            org.opencontainers.image.vendor=Refora Technologies
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.documentation=https://github.com/refora-technologies/basalt/blob/main/docker/README.md
            org.opencontainers.image.url=https://basalt.reforatech.com
          annotations: |
            org.opencontainers.image.title=Basalt Host
            org.opencontainers.image.description=Shares a drive with your phones and computers on your network, set up and managed from the Basalt app.
            org.opencontainers.image.vendor=Refora Technologies
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.documentation=https://github.com/refora-technologies/basalt/blob/main/docker/README.md
            org.opencontainers.image.url=https://basalt.reforatech.com

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
